name: Staging Build & Deploy

on:
  push:
    branches:
      - feature/brainweave-full
      - staging

jobs:
  build_staging:
    name: Build & Deploy Staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Flutter Web (Staging)
        run: flutter build web --release --dart-define=FLAVOR=staging

      - name: Deploy to Firebase Staging
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting --project staging
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  audit_trail:
    name: Post-Deployment Audit
    runs-on: ubuntu-latest
    needs: build_staging
    steps:
      - name: Log Deployment to Audit Service
        run: |
          echo "Staging deployment successful at $(date)"
