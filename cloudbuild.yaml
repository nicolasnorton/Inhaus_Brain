steps:
  # 1. Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build', 
      '-t', 'gcr.io/$PROJECT_ID/inhaus-brain:$_TAG', 
      '--build-arg', 'VERTEX_API_KEY=$_VERTEX_API_KEY',
      '--build-arg', 'GEMINI_API_KEY=$_GEMINI_API_KEY',
      '.'
    ]

  # 2. Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/inhaus-brain:$_TAG']

  # 3. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'inhaus-brain'
      - '--image'
      - 'gcr.io/$PROJECT_ID/inhaus-brain:$_TAG'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/inhaus-brain:$_TAG'

substitutions:
  _TAG: latest
  _VERTEX_API_KEY: ''
  _GEMINI_API_KEY: ''
