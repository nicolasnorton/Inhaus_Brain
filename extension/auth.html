<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InhausBrain Authentication</title>
    <link rel="stylesheet" href="sidepanel.css">
    <style>
        .auth-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
        }

        .auth-container img {
            width: 80px;
            height: 80px;
            margin-bottom: 16px;
        }
        
        .auth-container h2 {
            margin: 0 0 8px 0;
            font-size: 18px;
        }
        
        .auth-container p {
            color: var(--text-secondary);
            font-size: 13px;
            margin-bottom: 24px;
        }

        .auth-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            text-align: left;
            gap: 4px;
        }

        .input-group label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-left: 4px;
        }

        .auth-form input {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .auth-form input:focus {
            border-color: var(--accent);
        }

        .auth-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 8px;
            transition: opacity 0.2s;
        }

        .auth-btn:hover {
            opacity: 0.9;
        }

        .auth-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error-message {
            color: #ff6b6b;
            font-size: 12px;
            min-height: 16px;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <img src="icons/icon48.png" alt="Brain Icon">
            <h1>Brian</h1>
        </div>
    </header>

    <div class="auth-container">
        <img src="icons/icon128.png" alt="InhausBrain Logo">
        <h2>Welcome back</h2>
        <p>Sign in to your InhausBrain account to enable full agent capabilities.</p>

        <form class="auth-form" id="loginForm">
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" required autocomplete="email">
            </div>
            
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" required autocomplete="current-password">
            </div>

            <div class="error-message" id="errorMessage"></div>
            
            <button type="submit" class="auth-btn" id="loginBtn">Sign In</button>
        </form>

        <div class="divider">
            <span>or</span>
        </div>

        <button class="google-btn" id="googleBtn">
            <svg viewBox="0 0 24 24" width="18" height="18">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                <path d="M1 1h22v22H1z" fill="none"/>
            </svg>
            Sign in with Google
        </button>
    </div>

    <script src="auth.js"></script>
</body>
</html>
